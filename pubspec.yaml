name: carfinder
description: "CarFinder Copart and IAAI client application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/car_logo.png

  fonts:
    - family: CarFinderFont
      fonts:
        - asset: assets/fonts/carfinder_font.ttf
